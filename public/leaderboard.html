<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng xếp hạng trực tiếp — Rung Chuông Vàng</title>
<style>
  :root{ --red:#C7090E; --red-dark:#5a0305; --gold:#F5C518; --ink:#fff; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--red-dark),var(--red) 55%,#7a0608);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
  header{text-align:center;padding:28px 16px 14px}
  header .logo{font-weight:900;font-size:28px;letter-spacing:2px}
  header .logo span{color:var(--gold)}
  header h1{font-size:clamp(28px,4vw,48px);margin:6px 0;text-shadow:0 2px 10px rgba(0,0,0,.3)}
  header .state{font-size:clamp(16px,2vw,22px);color:var(--gold);font-weight:700}
  header .slogan{font-size:13px;opacity:.75;margin-top:4px;letter-spacing:1px}
  .grid{max-width:1200px;margin:0 auto;padding:10px 20px 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .row{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(4px);transition:transform .2s}
  .row.top3{background:linear-gradient(135deg,rgba(245,197,24,.3),rgba(245,197,24,.08));border-color:var(--gold)}
  .row.top30:not(.top3){border-color:rgba(245,197,24,.4)}
  .rank{font-size:22px;font-weight:900;min-width:40px;text-align:center}
  .row.top3 .rank{color:var(--gold);font-size:26px}
  .info{flex:1;min-width:0}
  .num{font-size:13px;opacity:.7}
  .name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .score{font-size:20px;font-weight:900;color:var(--gold)}
  .tied-badge{font-size:10px;background:rgba(255,255,255,.2);border-radius:6px;padding:1px 5px;margin-left:4px}
  .cutoff-note{text-align:center;max-width:900px;margin:0 auto 10px;padding:8px;font-size:13px;color:var(--gold);opacity:.85}
</style>
</head>
<body>
<header>
  <div class="logo">THE <span>KEY</span></div>
  <h1>🏆 Rung Chuông Vàng — Bảng Xếp Hạng</h1>
  <div class="state" id="stateLine">Đang tải...</div>
  <div class="slogan">Better Language – Better Life</div>
</header>
<div class="cutoff-note">🥇 Khung vàng = Top 3 &nbsp;&nbsp; ⭐ Viền vàng = Top 30</div>
<div class="grid" id="grid"></div>

<script>
async function load() {
  try {
    const r = await fetch('/api/leaderboard');
    const data = await r.json();
    const s = data.state;
    const roundLabel = s.round === 1 ? 'Vòng 1' : 'Vòng 2';
    document.getElementById('stateLine').textContent =
      s.status === 'finished' ? '🎉 CUỘC THI ĐÃ KẾT THÚC' : `${roundLabel} · Câu ${s.question}` + (s.status === 'closed' ? ' (đã đóng chấm)' : '');

    const grid = document.getElementById('grid');
    grid.innerHTML = data.rows.map(r => `
      <div class="row ${r.top3 ? 'top3' : ''} ${r.topN ? 'top30' : ''}">
        <div class="rank">${r.rank}</div>
        <div class="info">
          <div class="num">HS #${r.number}${r.tied ? '<span class="tied-badge">Đồng điểm</span>' : ''}</div>
          <div class="name">${r.name}</div>
        </div>
        <div class="score">${r.score}</div>
      </div>
    `).join('');
  } catch (e) { console.error(e); }
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
